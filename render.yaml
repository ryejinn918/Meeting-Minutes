services:
  - type: web
    name: meetflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_ANALYSIS_MODEL
        sync: false
      - key: AI_MODE
        value: real
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_STT_MODEL
        value: gpt-4o-transcribe-diarize
      - key: STT_MODE
        value: real
      - key: MAX_AUDIO_BYTES
        value: 52428800
      - key: STT_DIRECT_MAX_BYTES
        value: 20000000
      - key: STT_CHUNK_SECONDS
        value: 600
      - key: STT_CHUNK_OVERLAP_SECONDS
        value: 2
      - key: STT_MAX_CHUNKS
        value: 24
      - key: STT_MAX_AUDIO_SECONDS
        value: 14400
